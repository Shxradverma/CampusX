{% extends "base.html" %}

{% block title %}Server Error | CampusX{% endblock %}


{% block extra_css %}
<style>

    .error-page {
        min-height: 68vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 70px 0;
    }

    .error-wrapper {
        max-width: 650px;
        margin: auto;
        text-align: center;
    }

    .error-icon {
        width: 90px;
        height: 90px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 25px;

        border-radius: 24px;

        background: #fff7ed;
        color: #ea580c;

        font-size: 2.3rem;
    }

    .error-code {
        margin-bottom: 8px;

        color: #4f46e5;

        font-size: .8rem;
        font-weight: 800;
        letter-spacing: .12em;

        text-transform: uppercase;
    }

    .error-title {
        margin-bottom: 14px;

        color: #0f172a;

        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 800;

        letter-spacing: -1px;
    }

    .error-description {
        max-width: 520px;

        margin: 0 auto 28px;

        color: #64748b;

        font-size: .95rem;
        line-height: 1.7;
    }

    .error-actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .error-actions .btn {
        min-width: 150px;
    }

    @media (max-width: 575.98px) {

        .error-page {
            min-height: 60vh;
            padding: 50px 0;
        }

        .error-icon {
            width: 75px;
            height: 75px;
            font-size: 1.9rem;
        }

        .error-actions {
            flex-direction: column;
        }

        .error-actions .btn {
            width: 100%;
        }

    }

</style>
{% endblock %}


{% block content %}

<section class="error-page">

    <div class="container">

        <div class="error-wrapper">

            <div class="error-icon">
                <i class="bi bi-exclamation-triangle"></i>
            </div>

            <div class="error-code">
                Error 500
            </div>

            <h1 class="error-title">
                Something Went Wrong
            </h1>

            <p class="error-description">
                CampusX encountered an unexpected server error.
                Please return to the home page and try again.
            </p>

            <div class="error-actions">

                <a
                    href="{% url 'home' %}"
                    class="btn btn-primary"
                >
                    <i class="bi bi-house me-1"></i>
                    Go Home
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
